{% extends "base.html" %}
{% block title %}注册 — TimerService{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h4 class="card-title mb-4 text-center">
          <i class="bi bi-person-plus-fill me-2 text-primary"></i>创建账户
        </h4>
        <form method="POST" action="/register">
          <div class="mb-3">
            <label class="form-label">用户名 <small class="text-muted">(3–80字符)</small></label>
            <input type="text" name="username" class="form-control" required autofocus
                   minlength="3" maxlength="80" placeholder="请输入用户名" />
          </div>
          <div class="mb-3">
            <label class="form-label">密码 <small class="text-muted">(至少8字符)</small></label>
            <input type="password" name="password" class="form-control" required
                   minlength="8" placeholder="请输入密码" />
          </div>
          <div class="mb-3">
            <label class="form-label">确认密码</label>
            <input type="password" name="confirm_password" class="form-control" required
                   placeholder="再次输入密码" />
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">注册</button>
          </div>
        </form>
        <hr />
        <p class="text-center mb-0 small text-muted">
          已有账户？<a href="/login">直接登录</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
